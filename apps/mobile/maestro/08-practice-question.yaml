# Answer a practice question in the phone's own player (TA-590, 13 Nov 2026):
# the pupil's Practice screen opens a chapter here, not on the web, so the flow
# opens the first chapter, answers its first option and asserts the verdict and
# the next question. The option is chosen by position (its words are the
# question bank's data), so either verdict is right. Needs a pupil with the
# Student plan and a chapter on their list. Untested: needs a simulator and Maestro.
appId: school.edulink.app
name: Practice answers a question in the phone's player
tags: [student, practice]
---
- runFlow:
    file: common/sign-in.yaml
    env:
      EMAIL: "${ZZ_EMAIL_STUDENT}"
      MAGIC_TOKEN: "${MAGIC_TOKEN_STUDENT}"
- tapOn: "Practice"
- extendedWaitUntil:
    visible: "Your week"
    timeout: 10000
- assertVisible: "Practice that follows you. Get two right and it gets harder; get two wrong and it eases off."
- scrollUntilVisible:
    element:
      id: "practice-topic"
- tapOn:
    id: "practice-topic"
    index: 0
- extendedWaitUntil:
    visible:
      id: "choice-0"
    timeout: 10000
- tapOn:
    id: "choice-0"
- extendedWaitUntil:
    visible: "Got it right!|Not this time — the working is below."
    timeout: 10000
- assertVisible: "Next question"
