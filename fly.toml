# Fly.io: one long-running Node process per region, a release step that runs
# the migrations, and the health probe the platform restarts on. Postgres and
# object storage are managed services beside it (docs/runbooks/deploy.md).
app = "edulink-web"
primary_region = "bom"

[build]
  dockerfile = "apps/web/Dockerfile"

[deploy]
  release_command = "npm run db:migrate"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
