# Fly.io: one long-running Node process per region, a release step that runs
# the migrations, and the health probe the platform restarts on. Postgres and
# object storage are managed services beside it (docs/runbooks/deploy.md).
app = "edulink-web"
primary_region = "bom"

[build]
  dockerfile = "apps/web/Dockerfile"

[deploy]
  release_command = "npm run db:release"
  strategy = "rolling"

# Two process groups from one image. `web` serves; `jobs` starts the same
# server on loopback (127.0.0.1:3999, nothing routes to it) and kicks the
# in-process schedule (scripts/jobs-runner.mjs -> src/lib/job-scheduler.ts)
# on the owner connection; it is kept out of the http service below. Run one
# jobs machine: `fly scale count web=2 jobs=1`.
[processes]
  web = "node server.js"
  jobs = "node scripts/jobs-runner.mjs"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # The job schedules are read in this zone: 03:30 is 03:30 in India.
  TZ = "Asia/Kolkata"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Two web machines from the first deploy: the load run of 2026-10-01 put
  # one process at p95 4.5 s for the register under the plan profile, the
  # time being queueing for the pool and the CPU, not the request itself.
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

# 4 GB, not 1 (LOAD-8, 4 Oct 2026): one process held 1.1 GB after start and
# 3.1-3.6 GB under the college load profiles. One process per machine of two
# vCPUs; scale with `fly scale count web=N` (up to four web machines at
# connection_limit=15 before Postgres's 100 connections need a pooler).
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
