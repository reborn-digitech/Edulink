# The battery, in CI. Every check the repo already had, run the same way it is
# run by hand — nothing invented here, only wired. The sweep is the slow one:
# it needs a seeded database and a production server, so it runs on master and
# on demand, while everything else runs on every pull request.
name: battery

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Write a fresh Linux screenshot baseline set as an artifact"
        type: boolean
        default: false

concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway Postgres in trust mode: no passwords anywhere in this file.
  DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/edulink_ci
  DATABASE_URL: postgresql://edulink_app:edulink-ci@localhost:5432/edulink_ci
  PGUSER: postgres
  PGHOST: localhost
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  VAPID_SUBJECT: mailto:ci@edulink.test
  EMAIL_TRANSPORT: devbox
  EMAIL_FROM: EduLink <no-reply@edulink.test>
  SMS_TRANSPORT: devbox
  NEXT_PUBLIC_DEFAULT_COUNTRY_CODE: "+91"
  STORAGE_DIR: ./storage
  # The floor the i18n audit asserts. Lowering it is a deliberate change here.
  I18N_FLOOR: "189"

jobs:
  battery:
    name: typecheck · lint · unit · rls · quiz · i18n · audit · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database role and VAPID pair
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci" \
            -c "CREATE DATABASE edulink_shadow"
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            console.log(`::add-mask::${k.privateKey}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\n`);
          '

      - name: Migrations are the schema
        working-directory: apps/web
        run: |
          npx prisma generate
          # The CLI reads DATABASE_URL, which is the unprivileged app role;
          # migrations are owner work and go through the same wrapper as locally.
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          # A schema edit without a migration, or a migration that drifted from
          # the schema, fails here rather than on the release step.
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres@localhost:5432/edulink_shadow \
            --exit-code
          node scripts/db-grants.mjs
          # The seed is the fixture the integration suites stand on (two schools,
          # so tenant isolation has something it must not see); ZZ rows on top.
          npm run db:seed
          npm run zz:fixtures
          # The question bank: the content team's suite lists topics and expects some.
          npm run quiz:import

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit && npx tsc --noEmit -p scripts/tsconfig.json
      - name: Packages
        run: pnpm --filter './packages/*' typecheck && pnpm --filter './packages/*' test
      - name: Mobile battery · tsc, eslint, jest with the lib coverage gate, the Maestro flow check
        run: pnpm --filter @edulink/mobile battery
      - name: Mobile bundle size · both platforms, target 4 MB, ceiling 4.5 MB
        run: pnpm --filter @edulink/mobile bundle:check
      - name: Mobile bundle size record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-${{ github.run_number }}
          path: apps/mobile/bundle-size.json
          if-no-files-found: ignore
          retention-days: 90
      - name: ESLint
        working-directory: apps/web
        run: npx eslint .
      - name: Unit and integration suite
        working-directory: apps/web
        # The storage suite proves a traversal id can never reach the repo's
        # own .env, and needs that file to exist to prove it. The example is
        # placeholders; the real settings are already in the environment,
        # which dotenv never overrides.
        run: cp .env.example .env && npx vitest run
      - name: Row-level security isolation
        working-directory: apps/web
        run: npm run rls:verify
      - name: Question bank
        working-directory: apps/web
        run: npm run quiz:verify
      - name: i18n floor
        working-directory: apps/web
        run: npm run i18n -- --max "$I18N_FLOOR"
      - name: OpenAPI document is current
        working-directory: apps/web
        run: npm run api:docs -- --check
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Production build
        working-directory: apps/web
        run: npx next build

  sweep:
    name: route sweep · axe gate · viewport matrix · production server
    needs: battery
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database, seed and ZZ fixtures
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci"
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            console.log(`::add-mask::${k.privateKey}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\n`);
          '
          npx prisma generate
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          node scripts/db-grants.mjs
          npm run db:seed
          npm run zz:fixtures
          # The question bank: the content team's suite lists topics and expects some.
          npm run quiz:import
      - name: Build and start
        working-directory: apps/web
        run: |
          npx next build
          # The phone's web target is served on :8081 below; the API admits that origin.
          API_CORS_ORIGINS=http://localhost:8081 nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
      - name: Sweep
        working-directory: apps/web
        run: npm run sweep
      - name: API sweep · every endpoint as every role
        working-directory: apps/web
        run: npm run api:sweep
      - name: Mobile contract tests · the app's client against the API
        working-directory: apps/web
        # Bearer tokens minted on the ZZ fixture, the way the API sweep mints its own.
        run: |
          export EDULINK_API_BASE=http://localhost:3000
          export EDULINK_TOKEN_TEACHER="$(npm run --silent zz:token -- TEACHER)"
          export EDULINK_TOKEN_PARENT="$(npm run --silent zz:token -- PARENT)"
          export EDULINK_TOKEN_STUDENT="$(npm run --silent zz:token -- STUDENT)"
          pnpm --filter @edulink/mobile test:contract
          npm run --silent zz:token -- --purge
      - name: Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Mobile web target · export and serve on :8081
        working-directory: apps/mobile
        run: |
          EXPO_PUBLIC_API_URL=http://localhost:3000 npx expo export --platform web
          nohup npx expo serve --port 8081 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8081/ > /dev/null
      - name: Mobile accessibility gate, screenshots, offline and slow-network flows
        working-directory: apps/web
        # The same ZZ tokens the contract step mints; the app signs in with them on its web target.
        run: |
          export BASE=http://localhost:8081
          export API=http://localhost:3000
          export CI=true
          export EDULINK_TOKEN_TEACHER="$(npm run --silent zz:token -- TEACHER)"
          export EDULINK_TOKEN_PARENT="$(npm run --silent zz:token -- PARENT)"
          export EDULINK_TOKEN_STUDENT="$(npm run --silent zz:token -- STUDENT)"
          pnpm --filter @edulink/mobile e2e
          npm run --silent zz:token -- --purge
      - name: Mobile screenshots, report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-${{ github.run_number }}
          path: |
            apps/mobile/e2e/screens
            apps/mobile/e2e/report
            apps/mobile/e2e/results
          if-no-files-found: ignore
          retention-days: 14
      - name: Accessibility gate and viewport matrix
        working-directory: apps/web
        env:
          BASE: http://localhost:3000
          CI: "true"
        # `update_snapshots` writes a fresh Linux baseline set instead of
        # comparing; download the artifact and commit e2e/__screenshots__/linux.
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --update-snapshots
          else
            npx playwright test
          fi
      - name: Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_number }}
          path: |
            apps/web/e2e/report
            apps/web/e2e/results
            apps/web/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log
        if: always()
        working-directory: apps/web
        run: tail -n 200 server.log
