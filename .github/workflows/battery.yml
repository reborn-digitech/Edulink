# The battery, in CI. Every check the repo already had, run the same way it is
# run by hand — nothing invented here, only wired. The sweep is the slow one:
# it needs a seeded database and a production server, so it runs on master and
# on demand, while everything else runs on every pull request.
name: battery

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway Postgres in trust mode: no passwords anywhere in this file.
  DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/edulink_ci
  DATABASE_URL: postgresql://edulink_app:edulink-ci@localhost:5432/edulink_ci
  PGUSER: postgres
  PGHOST: localhost
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  VAPID_SUBJECT: mailto:ci@edulink.test
  EMAIL_TRANSPORT: devbox
  EMAIL_FROM: EduLink <no-reply@edulink.test>
  SMS_TRANSPORT: devbox
  NEXT_PUBLIC_DEFAULT_COUNTRY_CODE: "+91"
  STORAGE_DIR: ./storage
  # The floor the i18n audit asserts. Lowering it is a deliberate change here.
  I18N_FLOOR: "189"

jobs:
  battery:
    name: typecheck · lint · unit · rls · quiz · i18n · audit · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database role and VAPID pair
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci" \
            -c "CREATE DATABASE edulink_shadow"
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            console.log(`::add-mask::${k.privateKey}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\n`);
          '

      - name: Migrations are the schema
        working-directory: apps/web
        run: |
          npx prisma generate
          # The CLI reads DATABASE_URL, which is the unprivileged app role;
          # migrations are owner work and go through the same wrapper as locally.
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          # A schema edit without a migration, or a migration that drifted from
          # the schema, fails here rather than on the release step.
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres@localhost:5432/edulink_shadow \
            --exit-code
          node scripts/db-grants.mjs
          # The seed is the fixture the integration suites stand on (two schools,
          # so tenant isolation has something it must not see); ZZ rows on top.
          npm run db:seed
          npm run zz:fixtures

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit && npx tsc --noEmit -p scripts/tsconfig.json
      - name: Packages
        run: pnpm --filter './packages/*' typecheck && pnpm --filter './packages/*' test
      - name: ESLint
        working-directory: apps/web
        run: npx eslint .
      - name: Unit and integration suite
        working-directory: apps/web
        # The storage suite proves a traversal id can never reach the repo's
        # own .env, and needs that file to exist to prove it. The example is
        # placeholders; the real settings are already in the environment,
        # which dotenv never overrides.
        run: cp .env.example .env && npx vitest run
      - name: Row-level security isolation
        working-directory: apps/web
        run: npm run rls:verify
      - name: Question bank
        working-directory: apps/web
        run: npm run quiz:verify
      - name: i18n floor
        working-directory: apps/web
        run: npm run i18n -- --max "$I18N_FLOOR"
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Production build
        working-directory: apps/web
        run: npx next build

  sweep:
    name: route sweep · every role · production server
    needs: battery
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database, seed and ZZ fixtures
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci"
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            console.log(`::add-mask::${k.privateKey}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\n`);
          '
          npx prisma generate
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          node scripts/db-grants.mjs
          npm run db:seed
          npm run zz:fixtures
      - name: Build and start
        working-directory: apps/web
        run: |
          npx next build
          nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
      - name: Sweep
        working-directory: apps/web
        run: npm run sweep
      - name: Server log
        if: always()
        working-directory: apps/web
        run: tail -n 200 server.log
