# The battery, in CI. Every check the repo already had, run the same way it is
# run by hand — nothing invented here, only wired. The sweeps and the browser
# suites are the slow ones: they need a seeded database and a production
# server, so they run on master and on demand, as three jobs side by side
# after the battery, while everything else runs on every pull request.
name: battery

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Write a fresh Linux screenshot baseline set as an artifact"
        type: boolean
        default: false

concurrency:
  # A push cancels the push before it; a dispatch (a baseline-writing run,
  # asked for on a particular day) is its own group and is left to finish.
  group: battery-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # A throwaway Postgres in trust mode: no passwords anywhere in this file.
  DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/edulink_ci
  DATABASE_URL: postgresql://edulink_app:edulink-ci@localhost:5432/edulink_ci
  PGUSER: postgres
  PGHOST: localhost
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  VAPID_SUBJECT: mailto:ci@edulink.test
  EMAIL_TRANSPORT: devbox
  EMAIL_FROM: EduLink <no-reply@edulink.test>
  SMS_TRANSPORT: devbox
  NEXT_PUBLIC_DEFAULT_COUNTRY_CODE: "+91"
  STORAGE_DIR: ./storage
  # The floor the i18n audit asserts, here and in the local battery (`npm run
  # i18n -- --ci-floor` reads this line; TA-468). It sits AT the count: lower
  # it whenever the count falls, so new English never hides in the slack. Most
  # of what it counts are the job NAMES in src/lib/jobs.ts ("fees:remind",
  # "jobs:watch", "bank:stats" and the rest) — identifiers, not prose — so a
  # new job name raises it by one. 93 on 14 November 2026.
  I18N_FLOOR: "93"

# Every job names its runner image: ubuntu-latest moves to Ubuntu 26.04 on
# 19 October 2026 and no run of this battery on 26 has been seen — the
# Postgres client, fontconfig, the apt fonts and Playwright's --with-deps
# all stand on what 24.04 ships. Moving is a deliberate change here, after a
# run on the new image.
jobs:
  battery:
    name: typecheck · lint · unit · rls · quiz · i18n · audit · build
    runs-on: ubuntu-24.04
    # About 26 minutes on 2026-10-01 (the phone battery 5 to 10 of them, the
    # web suite 6, the build 4 to 5); run 36848020146 met the old 30-minute cap
    # in the production build with every step before it green.
    # 1 Nov 2026: 45 cut the job off at the unit suite on the first runs since billing (typecheck 25 min, the phone
    # battery 8, the bundle gate 4 before the suite even starts); 120 holds the whole job with room.
    timeout-minutes: 120
    services:
      postgres:
        # pgvector for the assistant's content tables (migration 20261008151729_assistant_content).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database role and VAPID pair
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci" \
            -c "CREATE DATABASE edulink_shadow"
          # 1 Nov 2026: the unit suite seals bank accounts, UPI ids and survey keys under FEES_SECRET_KEY and
          # signs file links under FILE_LINK_SECRET, as the server jobs below already set; the first CI run
          # since billing failed 55 tests for want of them.
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            const fees = require("crypto").randomBytes(32).toString("base64");
            const links = require("crypto").randomBytes(32).toString("base64url");
            console.log(`::add-mask::${k.privateKey}`);
            console.log(`::add-mask::${fees}`);
            console.log(`::add-mask::${links}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\nFEES_SECRET_KEY=${fees}\nFILE_LINK_SECRET=${links}\n`);
          '

      - name: Migrations are the schema
        working-directory: apps/web
        run: |
          npx prisma generate
          # The CLI reads DATABASE_URL, which is the unprivileged app role;
          # migrations are owner work and go through the same wrapper as locally.
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          # A schema edit without a migration, or a migration that drifted from
          # the schema, fails here rather than on the release step.
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres@localhost:5432/edulink_shadow \
            --exit-code
          node scripts/db-grants.mjs
          # The seed is the fixture the integration suites stand on (two schools,
          # so tenant isolation has something it must not see); ZZ rows on top.
          npm run db:seed
          npm run zz:fixtures
          # The question bank: the content team's suite lists topics and expects some.
          npm run quiz:import

      - name: Typecheck
        working-directory: apps/web
        run: NODE_OPTIONS=--max-old-space-size=8192 npx tsc --noEmit && NODE_OPTIONS=--max-old-space-size=8192 npx tsc --noEmit -p scripts/tsconfig.json
      - name: Packages
        run: pnpm --filter './packages/*' typecheck && pnpm --filter './packages/*' test
      - name: Mobile battery · tsc, eslint, jest with the lib coverage gate, the Maestro flow check
        # Jest's own process holds every suite's result and the coverage map;
        # at 178 suites it crossed the runner's ~2 GB default heap 151 suites in
        # (run 36846750919, "JavaScript heap out of memory"). A Mac's default
        # is larger. Four (the web's tsc moved to eight with the college tables).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @edulink/mobile battery
      - name: Mobile bundle size · both platforms, target 4.5 MB, ceiling 6 MB
        run: pnpm --filter @edulink/mobile bundle:check
      - name: Mobile bundle size record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-${{ github.run_number }}
          path: apps/mobile/bundle-size.json
          if-no-files-found: ignore
          retention-days: 90
      - name: ESLint
        working-directory: apps/web
        # TA-514: a warning fails the job, as the commits' own --max-warnings 0 claims (0 warnings on 14 Nov 2026).
        run: npx eslint . --max-warnings 0
      - name: Unit and integration suite
        working-directory: apps/web
        # The storage suite proves a traversal id can never reach the repo's
        # own .env, and needs that file to exist to prove it. The example is
        # placeholders; the real settings are already in the environment,
        # which dotenv never overrides.
        run: cp .env.example .env && npx vitest run
      - name: Row-level security isolation
        working-directory: apps/web
        run: npm run rls:verify
      - name: Question bank
        working-directory: apps/web
        run: npm run quiz:verify
      - name: i18n floor
        working-directory: apps/web
        run: npm run i18n -- --max "$I18N_FLOOR"
      - name: OpenAPI document is current
        working-directory: apps/web
        run: npm run api:docs -- --check
      # Ignored advisories live in the root package.json (pnpm.auditConfig.ignoreGhsas):
      # GHSA-ggr8-5vv4-36mx (deepmerge-ts 7 under Prisma 6's config loader, tooling,
      # fixed only in the 8 major), and since 2 November 2026 GHSA-mrhx-c7xc-m3w5 (zod
      # 3.25.76, fixed upstream only in zod 4.6.6): its fix, a collection over its
      # .max()/.length() failing before any element is parsed, is backported into zod's
      # v3 array and set by patches/zod@3.25.76.patch, so the ignore stands while that
      # patch does; drop both when the contracts move to zod 4. GHSA-86w9-cpqp-85rv
      # (node-forge) left the list on 2 November 2026: node-forge 1.4.2 is out of its range.
      # The pnpm.overrides beside them each lift a transitive package to its patched
      # release within its major (2 November 2026: shell-quote, compression, node-forge,
      # source-map-js under Expo's CLI and React Native; decode-uri-component under
      # expo-router's query-string, which patches/query-string@7.1.3.patch lets require
      # the ES-module-only 0.5 line). Review both lists when Expo or Prisma ships a fix.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      # The build script sets the heap (8 GB since 18 October 2026, when the
      # compile ran out at 4 GB); the four build steps here call it rather than
      # next build directly so the number lives in one place. Run 41346437152
      # (2 November 2026) died at 4 GB with the script already at 8.
      - name: Production build
        working-directory: apps/web
        run: npm run build

  # The three jobs below each need a seeded database and a production server,
  # and each builds and starts its own: the build is about five minutes, and
  # repeating it three times is simpler than handing a .next directory between
  # jobs as an artifact. Until 2 October 2026 they were one job of about 70
  # minutes under a 90-minute cap (run 36936519173: set-up and build 8, the
  # sweeps and contract tests 4, the web suite 39, the phone's suite 32); as
  # three they finish together in the time of the longest.
  sweep:
    name: route sweep · API sweep · contract tests · production server
    needs: battery
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Measured on run 36936519173: set-up, seed and build 8 minutes, the page
    # sweep 1.3, the API sweep 2, the fixtures again and the contract tests 1 —
    # 12 in all; 1.5 × 12 = 18, so 20. On run 41352685224 (2 November 2026)
    # the build alone took 11 minutes and the API sweep, which since item 13
    # walks every role variant of every door (13 to 22 minutes on a Mac), was
    # cut at the cap five minutes in; 60 leaves it room to finish.
    timeout-minutes: 60
    services:
      postgres:
        # pgvector for the assistant's content tables (migration 20261008151729_assistant_content).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database, seed and ZZ fixtures
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci"
          # The server is configured as the laptop's is: a VAPID pair, and a
          # throwaway FEES_SECRET_KEY, the box that seals gateway keys and the
          # two-step sign-in secrets — without it POST /account/totp/start
          # rightly answers 403, which is a deployment's choice and not what the
          # catalog's sweep of the office and the head is there to prove. And a
          # FILE_LINK_SECRET: a production build signs no file links without
          # one (file-links.ts) and answers 503, where the dev server makes a
          # key per process; a deployment must set it (env.ts, fatal).
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            const fees = require("crypto").randomBytes(32).toString("base64");
            const links = require("crypto").randomBytes(32).toString("base64url");
            console.log(`::add-mask::${k.privateKey}`);
            console.log(`::add-mask::${fees}`);
            console.log(`::add-mask::${links}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\nFEES_SECRET_KEY=${fees}\nFILE_LINK_SECRET=${links}\n`);
          '
          npx prisma generate
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          node scripts/db-grants.mjs
          npm run db:seed
          npm run zz:fixtures
          # The question bank: the content team's suite lists topics and expects some.
          npm run quiz:import
      - name: Build and start
        working-directory: apps/web
        run: |
          npm run build
          # The phone's web target is served on :8081 by the mobile-e2e job; the API admits that origin.
          API_CORS_ORIGINS=http://localhost:8081 nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
      - name: Sweep
        working-directory: apps/web
        run: npm run sweep
      - name: API sweep · every endpoint as every role
        working-directory: apps/web
        # TA-512 (decided 14 November 2026: list first, then declare and tighten): the run lists every fixed-address
        # read that answered 404 to a permitted role with nothing declared for it, and fails none of them; the list is
        # uploaded below, for the by-design 404s to be declared per role before the default becomes "must succeed".
        run: npm run api:sweep -- --report-not-found=api-sweep-not-found.json
      - name: API sweep not-found list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-sweep-not-found-${{ github.run_number }}
          path: apps/web/api-sweep-not-found.json
          if-no-files-found: ignore
          retention-days: 90
      # The API sweep acts as every role and then removes what it wrote, and
      # "rows it replaced went with them — run zz:fixtures" (its own last line):
      # the admin's signature, the papers waiting for the head and more. The
      # contract tests after it stand on the fixtures as built (run 36871181377
      # found "No signature yet" and "Nothing is waiting for you").
      - name: Fixtures again, after the API sweep
        working-directory: apps/web
        run: npm run zz:fixtures
      - name: Mobile contract tests · the app's client against the API
        working-directory: apps/web
        # Bearer tokens minted on the ZZ fixture, the way the API sweep mints its own, six hours long (TA-462).
        # TA-460: `export X="$(…)"` hid zz:token's exit status, so a role whose actor was missing dropped out of the
        # suite with the step green; mint() stops the step on a failed or empty mint, naming the role.
        run: |
          export EDULINK_API_BASE=http://localhost:3000
          mint() { local t; t="$(npm run --silent zz:token -- --hours=6 "$1")" && [ -n "$t" ] || { echo "zz:token minted no token for $1: the fixture lacks that actor" >&2; exit 1; }; export "EDULINK_TOKEN_$1=$t"; }
          for role in TEACHER PARENT STUDENT ADMIN PRINCIPAL EXPERT DRIVER LIBRARIAN WARDEN ALUMNUS FACULTY HOD EXAM_CONTROLLER IQAC TPO ACCOUNTS RECRUITER; do mint "$role"; done
          pnpm --filter @edulink/mobile test:contract
          npm run --silent zz:token -- --purge
      - name: Server log
        if: always()
        working-directory: apps/web
        run: tail -n 200 server.log

  web-e2e:
    name: web · ${{ matrix.suite }}${{ matrix.part }} · production server
    needs: battery
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The two projects playwright.config.ts cuts the suite into: the axe
        # walk alone (354 pages, 21 minutes on run 36936519173) and every other
        # spec (143 tests: the viewport matrix, the record, the seven flows,
        # the editors; 18 minutes). The walk is 1,240 pages since the roles,
        # modules and college streams of October, and on run 41376053419
        # (2 November 2026) 1,016 of them took 86 minutes on one worker, past
        # the hour the sessions lived and past any cap worth setting, so it
        # runs as two Playwright shards on two runners, each its own server.
        include:
          - { suite: axe, shard: 1/2, part: " 1 of 2" }
          - { suite: axe, shard: 2/2, part: " 2 of 2" }
          - { suite: pages, shard: 1/1, part: "" }
    # Measured on run 36936519173: set-up, seed and build 8 minutes, the
    # browsers 0.5, the axe walk 21 — 30 for the longer entry; 1.5 × 30 = 45.
    # On run 41352685224 (2 November 2026) the walk was 1,240 pages (the new
    # roles, modules and college streams) and reached 625 in 33 minutes before
    # the cap; on 41376053419 1,016 in 86. Half the walk is about 55 minutes,
    # plus 13 to seed and build; 100 covers a shard with room.
    timeout-minutes: 100
    services:
      postgres:
        # pgvector for the assistant's content tables (migration 20261008151729_assistant_content).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database, seed and ZZ fixtures
        working-directory: apps/web
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci"
          # The server is configured as the laptop's is: a VAPID pair, and a
          # throwaway FEES_SECRET_KEY, the box that seals gateway keys and the
          # two-step sign-in secrets — without it POST /account/totp/start
          # rightly answers 403, which is a deployment's choice and not what the
          # catalog's sweep of the office and the head is there to prove. And a
          # FILE_LINK_SECRET: a production build signs no file links without
          # one (file-links.ts) and answers 503, where the dev server makes a
          # key per process; a deployment must set it (env.ts, fatal).
          node -e '
            const k = require("web-push").generateVAPIDKeys();
            const fees = require("crypto").randomBytes(32).toString("base64");
            const links = require("crypto").randomBytes(32).toString("base64url");
            console.log(`::add-mask::${k.privateKey}`);
            console.log(`::add-mask::${fees}`);
            console.log(`::add-mask::${links}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\nFEES_SECRET_KEY=${fees}\nFILE_LINK_SECRET=${links}\n`);
          '
          npx prisma generate
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          node scripts/db-grants.mjs
          npm run db:seed
          npm run zz:fixtures
          # The question bank: the content team's suite lists topics and expects some.
          npm run quiz:import
      - name: Build and start
        working-directory: apps/web
        run: |
          npm run build
          # The phone's web target is served on :8081 by the mobile-e2e job; the API admits that origin.
          API_CORS_ORIGINS=http://localhost:8081 nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
      - name: Inter, the face the pages' widths are measured in
        # The pages are set in the system's face (globals.css --font-sans:
        # ui-sans-serif, system-ui, …, Roboto, …, Arial, sans-serif), which on
        # the runner is DejaVu Sans — wider than any phone's face, so the walk
        # and the matrix measured widths no phone draws and compared pictures no
        # phone shows. Inter (public/fonts/inter, OFL, the face the certificates
        # ship) goes in the user's font directory and fontconfig is told to
        # prefer it for sans-serif and system-ui, so Chromium sets the pages in
        # it — as the mobile-e2e job installs Roboto for the phone's.
        run: |
          mkdir -p ~/.fonts ~/.config/fontconfig
          cp apps/web/public/fonts/inter/*.ttf ~/.fonts/
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
            <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match sans-serif
          fc-match system-ui
      - name: Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate, viewport matrix, record, flows and editors · ${{ matrix.suite }}
        working-directory: apps/web
        env:
          BASE: http://localhost:3000
          CI: "true"
        # `update_snapshots` writes a fresh Linux baseline set instead of
        # comparing; download the artifact and commit e2e/__screenshots__/linux.
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --project ${{ matrix.suite }} --shard ${{ matrix.shard }} --update-snapshots
          else
            npx playwright test --project ${{ matrix.suite }} --shard ${{ matrix.shard }}
          fi
      - name: Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_number }}-${{ matrix.suite }}-${{ strategy.job-index }}
          path: |
            apps/web/e2e/report
            apps/web/e2e/results
            apps/web/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log
        if: always()
        working-directory: apps/web
        run: tail -n 200 server.log

  mobile-e2e:
    name: phone · axe gate · screenshots · offline and slow-network flows
