          node -e '
            const k = require("web-push").generateVAPIDKeys();
            const fees = require("crypto").randomBytes(32).toString("base64");
            const links = require("crypto").randomBytes(32).toString("base64url");
            console.log(`::add-mask::${k.privateKey}`);
            console.log(`::add-mask::${fees}`);
            console.log(`::add-mask::${links}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\nFEES_SECRET_KEY=${fees}\nFILE_LINK_SECRET=${links}\n`);
          '
          npx prisma generate
          node scripts/with-admin-db.mjs npx prisma migrate deploy
          node scripts/db-grants.mjs
          npm run db:seed
          npm run zz:fixtures
          # The question bank: the content team's suite lists topics and expects some.
          npm run quiz:import
      - name: Build and start
        working-directory: apps/web
        run: |
          npm run build
          # The phone's web target is served on :8081 by the mobile-e2e job; the API admits that origin.
          API_CORS_ORIGINS=http://localhost:8081 nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
      # The web suite's global set-up creates the ZZ exam series and paper the
      # phone's offline flow enters a mark on (e2e/offline.spec.ts, "ZZ E2E
      # Unit Test"); when the phone's suite ran after the web's in one job it
      # found them made. Run on its own here, the sessions it mints unused.
      - name: The web suite's set-up · the ZZ exam series the offline flow marks
        working-directory: apps/web
        run: npx tsx -e 'require("./e2e/global-setup.ts").default()'
      - name: Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Mobile web target · export and serve on :8081
        working-directory: apps/mobile
        run: |
          EXPO_PUBLIC_API_URL=http://localhost:3000 npx expo export --platform web
          nohup npx expo serve --port 8081 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8081/ > /dev/null
      - name: Roboto, the font an Android phone draws
        # The phone's UI/UX audit measures tab labels in the phone's own font;
        # without Roboto the runner draws DejaVu Sans, which no phone uses.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-roboto
          fc-match Roboto
      - name: Mobile accessibility gate, screenshots, offline and slow-network flows
        working-directory: apps/web
        # ZZ tokens minted as the contract step mints them, one per role; the app signs in with them on its web target.
        # TA-460: a failed or empty mint stops the step, so no role drops out of the gate silently.
        # Six hours, not zz:token's default one (TA-462): the suite has run 38 to 46 minutes and more on a contended
        # runner, and a token that lapses mid-run sends every later test back to sign-in. The purge removes them.
        run: |
          export BASE=http://localhost:8081
          export API=http://localhost:3000
          export CI=true
          mint() { local t; t="$(npm run --silent zz:token -- --hours=6 "$1")" && [ -n "$t" ] || { echo "zz:token minted no token for $1: the fixture lacks that actor" >&2; exit 1; }; export "EDULINK_TOKEN_$1=$t"; }
          for role in TEACHER PARENT STUDENT ADMIN PRINCIPAL EXPERT DRIVER LIBRARIAN WARDEN ALUMNUS FACULTY HOD EXAM_CONTROLLER IQAC TPO ACCOUNTS RECRUITER OPERATOR APPADMIN; do mint "$role"; done
          pnpm --filter @edulink/mobile e2e
          npm run --silent zz:token -- --purge
      - name: Mobile screenshots, report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-${{ github.run_number }}
          path: |
            apps/mobile/e2e/screens
            apps/mobile/e2e/store
            apps/mobile/e2e/report
            apps/mobile/e2e/results
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log
        if: always()
        working-directory: apps/web
        run: tail -n 200 server.log

  image:
    name: container image · release step · health · jobs runner
    needs: battery
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        # pgvector for the assistant's content tables (migration 20261008151729_assistant_content).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # A throwaway push pair, made BEFORE the build: the browser's half is
      # fixed into the client bundle by `next build`, so it goes in as a build
      # arg (the way deploy.md says a deployment passes its own), and the
      # server compares it with the runtime private half at boot. Node's own
      # P-256 (the runner has no web-push); the private key is padded to its
      # 32 bytes. Only the two assignments go to the env file — a mask line in
      # it is an invalid format.
      # An image this job PUBLISHES (PUBLISH_IMAGE) is what production runs,
      # and a deployed server refuses a built-in key that is not its private
      # key's pair — so with the repository variable NEXT_PUBLIC_VAPID_PUBLIC_KEY
      # set (the deployment's public half; public by definition) the image is
      # built with that instead. CI holds no private half for it: the server
      # here says "not a pair" as a warning (CI is not deployed) and boots.
      - name: Push keys for the build
        env:
          DEPLOYMENT_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          keys=$(node -e '
            const e = require("crypto").createECDH("prime256v1"); e.generateKeys();
            const priv = Buffer.concat([Buffer.alloc(32), e.getPrivateKey()]).subarray(-32);
            console.log(e.getPublicKey().toString("base64url") + " " + priv.toString("base64url"));')
          pub=${keys% *}; priv=${keys#* }
          if [ -n "$DEPLOYMENT_PUBLIC_KEY" ]; then pub=$DEPLOYMENT_PUBLIC_KEY; echo "building with the deployment's public key (repository variable)"; fi
          echo "::add-mask::$priv"
          echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$priv" >> "$GITHUB_ENV"
          echo "public key ${#pub} chars, private ${#priv} chars"
      # The image nobody had built: apps/web/Dockerfile, from the repository
      # root, with the commit stamped and the push key built in the way the
      # deploy runbook says.
      - name: Build the image
        run: docker build -f apps/web/Dockerfile --build-arg APP_COMMIT=${GITHUB_SHA::7} --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY -t edulink-web:ci .
      - name: Database role, and the push key in the image
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE edulink_app LOGIN PASSWORD 'edulink-ci'" \
            -c "CREATE DATABASE edulink_ci"
          # The traced node_modules resolve from inside the container.
          docker run --rm edulink-web:ci node -e 'require("web-push"); console.log("web-push resolves in the image")'
          # The browser's key is in the client bundle, not only on the host.
          docker run --rm edulink-web:ci sh -c "grep -rlF '$NEXT_PUBLIC_VAPID_PUBLIC_KEY' .next/static | head -1 | grep -q . && echo 'push key built into the client bundle'"
      # The release step, inside the container, the way fly.toml runs it before
      # the new machines take traffic: migrations, then the grants and policies.
      - name: Release step in the container
        run: docker run --rm --network host -e DATABASE_URL -e DATABASE_ADMIN_URL edulink-web:ci npm run db:release
      - name: Serve, and answer health with the commit
        run: |
          docker run -d --name web --network host \
            -e DATABASE_URL -e DATABASE_ADMIN_URL -e NEXT_PUBLIC_APP_URL -e VAPID_SUBJECT \
            -e NEXT_PUBLIC_VAPID_PUBLIC_KEY -e VAPID_PRIVATE_KEY -e EMAIL_TRANSPORT -e EMAIL_FROM -e SMS_TRANSPORT \
            -e NEXT_PUBLIC_DEFAULT_COUNTRY_CODE -e STORAGE_DIR=/tmp/storage \
            edulink-web:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          body=$(curl -sf http://localhost:3000/api/health)
          echo "$body"
          echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA::7}\""
          curl -sf -o /dev/null -w "/login %{http_code}\n" http://localhost:3000/login
          curl -sf -o /dev/null -w "/privacy %{http_code}\n" http://localhost:3000/privacy
          curl -sf http://localhost:3000/api/v1/app/version | head -c 200; echo
      # The second process group from the same image: the schedule starts
      # in-process, on the owner connection, on loopback.
      - name: The jobs runner starts its schedule
        run: |
          docker run -d --name jobs --network host \
            -e JOBS_RUNNER=1 -e HOSTNAME=127.0.0.1 -e PORT=3999 -e TZ=Asia/Kolkata \
            -e DATABASE_URL -e DATABASE_ADMIN_URL -e NEXT_PUBLIC_APP_URL -e VAPID_SUBJECT \
            -e NEXT_PUBLIC_VAPID_PUBLIC_KEY -e VAPID_PRIVATE_KEY -e EMAIL_TRANSPORT -e EMAIL_FROM -e SMS_TRANSPORT \
            -e NEXT_PUBLIC_DEFAULT_COUNTRY_CODE -e STORAGE_DIR=/tmp/storage \
            edulink-web:ci node scripts/jobs-runner.mjs
          for i in $(seq 1 45); do docker logs jobs 2>&1 | grep -q '"scheduler":"in-process","started":true' && break; sleep 2; done
          docker logs jobs 2>&1 | grep -E '"scheduler":"(in-process|kick)"' | head -2
          docker logs jobs 2>&1 | grep -q '"scheduler":"in-process","started":true'
          # And it is not reachable on the web port: the schedule runs, the pages do not.
          # TA-522: under host networking loopback is the host's own, so loopback answering proves nothing; the check
          # is that the runner (HOSTNAME=127.0.0.1) does not answer on the host's routable address, and it now fails.
          addr=$(hostname -I | awk '{print $1}')
          if curl -sf -o /dev/null --max-time 5 "http://$addr:3999/login"; then echo "jobs runner answered a page on $addr:3999 (expected: loopback only)"; exit 1; fi
      - name: Container logs
        if: always()
        run: |
          echo "== web"; docker logs web 2>&1 | tail -40
          echo "== jobs"; docker logs jobs 2>&1 | tail -20
      # Opt-in publish: set the repository variable PUBLISH_IMAGE to "true" and
      # every green push to master lands as ghcr.io/<owner>/edulink-web:<sha>
      # and :latest, which is what `fly deploy --image` deploys.
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PUBLISH_IMAGE == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag edulink-web:ci ghcr.io/$owner/edulink-web:${GITHUB_SHA::7}
          docker tag edulink-web:ci ghcr.io/$owner/edulink-web:latest
          docker push ghcr.io/$owner/edulink-web:${GITHUB_SHA::7}
          docker push ghcr.io/$owner/edulink-web:latest

